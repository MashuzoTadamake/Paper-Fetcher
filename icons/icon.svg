<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Paper Document Sheet -->
  <rect x="34" y="26" width="56" height="74" rx="6" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Document Lines -->
  <line x1="44" y1="42" x2="80" y2="42" stroke="#dc2626" stroke-width="4" stroke-linecap="round" />
  <line x1="44" y1="54" x2="78" y2="54" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" />
  <line x1="44" y1="65" x2="66" y2="65" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" />

  <!-- Unlock/Lightning Emblem Badge -->
  <circle cx="86" cy="88" r="22" fill="url(#boltGrad)" stroke="#ffffff" stroke-width="3.5" filter="url(#shadow)" />

  <!-- Lightning Bolt Symbol -->
  <polygon points="88,74 77,88 84,88 82,102 95,88 88,88" fill="#ffffff" />
</svg>
